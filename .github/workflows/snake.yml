name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Third-party actions with write access to this repo. Pinned to major tags as the
      # upstream docs recommend; pin to a full commit SHA if you want to remove the
      # supply-chain risk of a moving tag.
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ajayspi
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
